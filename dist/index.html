<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国旅行地图 · 江西</title>
<meta name="description" content="江西 11 市抽象旅行地图。选择颜色，点击填色，导出完整图片。">
<link rel="stylesheet" href="style.css">
<script defer src="map-data.js"></script><script defer src="app.js"></script>
</head>
<body>
<header class="top"><a class="brand" href="./">中国旅行地图<span>TRAVEL ATLAS</span></a><span class="edition">江西样图 · 01</span></header>
<main>
<aside>
<p class="eyebrow">在地图上，留下足迹</p>
<h1>从江西<br>开始。</h1>
<p class="intro">选一种颜色，点亮一座城市。</p>
<fieldset><legend>填充颜色</legend><div id="palette" class="palette"></div><label class="custom">自选颜色<input id="custom-color" type="color" value="#2864dc" aria-label="自选填充颜色"></label></fieldset>
<p class="hint">白色可擦除标记。也可用 Tab 选择城市，按回车填色。</p>
<div class="progress"><strong id="count">0</strong><span>/ 11 座城市已填色</span></div>
<button id="export" class="primary">导出完整图片 <span aria-hidden="true">↓</span></button>
<button id="reset" class="secondary">清空颜色</button>
<p id="status" class="status" role="status" aria-live="polite">点击地图即可填色</p>
</aside>
<section class="workspace" aria-label="江西抽象旅行地图">
<div class="paper"><svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 860" aria-labelledby="map-title map-desc">
<title id="map-title">江西省 11 市抽象地图</title><desc id="map-desc">边界和面积经过调整的旅行标记示意图。每座城市可独立填色。</desc>
<rect width="760" height="860" fill="#fff"/>
<g font-family="sans-serif" fill="#17263b"><text x="64" y="76" font-size="34" font-weight="700">江西</text><text x="65" y="101" font-size="12" letter-spacing="2.4" fill="#68768a">JIANGXI / TRAVEL MAP</text><text x="695" y="69" text-anchor="end" font-size="12" fill="#68768a">中国旅行地图</text></g>
<path d="M680 142V114M673 122L680 114L687 122" fill="none" stroke="#17263b" stroke-width="1.5"/><text x="680" y="105" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#17263b">N</text>
<g id="regions" stroke="#26364b" stroke-width="2" stroke-linejoin="round"></g>
<path id="outline" fill="none" stroke="#17263b" stroke-width="3" stroke-linejoin="round" pointer-events="none"/>
<g id="labels" font-family="sans-serif" font-size="21" font-weight="600" text-anchor="middle" dominant-baseline="central" pointer-events="none"></g>
<path d="M64 795H696" stroke="#dfe5ec"/><g font-family="sans-serif" fill="#68768a" font-size="12"><text x="64" y="822">市级抽象示意 · 边界与面积非等比例</text><text x="696" y="822" text-anchor="end">江西 / 11 市</text></g>
</svg></div>
<p class="caption">保留相邻关系，重新安排边界与面积。</p>
</section>
</main>
<footer><span>中国旅行地图 · 江西初步样图</span><a href="https://github.com/orange-v-soda/china-travel-map" target="_blank" rel="noopener">GitHub ↗</a></footer>
</body></html>
