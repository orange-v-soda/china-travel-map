<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>南昌—九江—抚州联合语义视图</title>
  <style>
    :root{color-scheme:light;--ink:#243a34;--muted:#65736d;--paper:#f6f2e8;--line:#d8d6c9}
    *{box-sizing:border-box}body{margin:0;background:#ebe8df;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Noto Sans SC",sans-serif}
    header,main{max-width:1500px;margin:auto}header{padding:28px 24px 16px;display:flex;align-items:end;justify-content:space-between;gap:24px}
    h1{margin:0;font-size:26px}p{margin:5px 0 0;color:var(--muted)}a{color:inherit}
    .paper{margin:0 24px 30px;padding:18px;background:var(--paper);border:1px solid var(--line);box-shadow:0 10px 34px #31433a18}
    img{display:block;width:100%;height:auto}
    .legend{display:flex;flex-wrap:wrap;gap:16px;padding:14px 6px 0;color:var(--muted)}
    .legend span{display:inline-flex;align-items:center;gap:7px}.legend i{width:14px;height:14px;border-radius:3px;border:1px solid #0002}
    @media(max-width:720px){header{align-items:start;flex-direction:column}.paper{margin-inline:10px;padding:8px}}
  </style>
</head>
<body>
  <header>
    <div><h1>南昌—九江—抚州联合语义视图</h1><p>页面全局坐标 · 共享岸线、河道与地貌过渡 · 生成前审阅</p></div>
    <a href="./">返回完整地图</a>
  </header>
  <main>
    <figure class="paper">
      <img src="assets/joint-nanchang-jiujiang-fuzhou/nanchang-jiujiang-fuzhou-joint-semantic-v8.svg" alt="南昌、九江与抚州的逐次联合语义 SVG">
      <figcaption class="legend">
        <span><i style="background:#70906c"></i>山地</span>
        <span><i style="background:#a9c8c5"></i>开放水面</span>
        <span><i style="background:#9da3a1"></i>都市</span>
        <span><i style="background:#c8c3b7"></i>县城</span>
        <span><i style="background:#ddcea0"></i>乡村与农田</span>
        <span><i style="background:#dce2bd"></i>低地与荒野</span>
      </figcaption>
    </figure>
  </main>
</body>
</html>
