<div class="heading"><div><h1>香港、澳门、上海，接入旅行地图。</h1><p class="intro">左侧为基础图，右侧为面积均衡图。悬停对照同一区划，点击可同步填色。</p></div><div class="progress"><strong id="count">0</strong><span>/ 85 个区划已填色</span></div></div>
<p class="intro" id="balance-summary" style="margin-bottom:16px"></p><label class="iteration-control" style="margin-bottom:16px">查看范围<select id="focus"><option value="all">全部 85 个区划</option><option value="delta">珠三角与港澳</option><option value="macau">澳门与珠海</option><option value="hongkong">香港与深圳</option><option value="shanghai">上海与周边</option><option value="minnan">厦门与周边</option><option value="chaoshan">潮汕地区</option><option value="islands">舟山与宁波</option><option value="shangrao">上饶与周边</option></select></label><div class="toolbar"><fieldset><legend class="sr-only">填充颜色</legend><span class="tool-label" aria-hidden="true">填充颜色</span><div id="palette" class="palette"></div><label class="custom">自选<input id="custom-color" type="color" value="#2864dc" aria-label="自选填充颜色"></label></fieldset><div class="actions"><button id="reset" class="secondary">清空颜色</button><button id="export" class="primary">导出抽象图 PNG <span aria-hidden="true">↓</span></button></div></div>

<div class="comparison">

<path d="M1580 142V114M1573 122L1580 114L1587 122" fill="none" stroke="#17263b" stroke-width="1.5"/><text x="1580" y="105" text-anchor="middle" font-size="12" font-family="sans-serif" fill="#17263b">N</text>

</g><path d="M64 1815H1596" stroke="#dfe5ec"/><g font-family="sans-serif" fill="#68768a" font-size="12"><text id="map-note" x="64" y="1842">轮廓结构保持 · 区划面积均衡示意</text><text x="1596" y="1842" text-anchor="end">赣 · 浙 · 闽 · 湘 · 皖 · 粤 · 港 · 澳 · 沪 / 85 个市级区划</text></g>
